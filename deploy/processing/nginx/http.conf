# HTTP bootstrap: expose only ACME challenges until the TLS certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name inference.junction2026.kavostudio.dev;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
