# Do not log query parameters, request bodies, or API-key headers.
log_format inference_api '$remote_addr [$time_local] "$request_method $uri" '
                         '$status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name inference.junction2026.kavostudio.dev;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://inference.junction2026.kavostudio.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name inference.junction2026.kavostudio.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/inference.junction2026.kavostudio.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inference.junction2026.kavostudio.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:InferenceTLS:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/inference.access.log inference_api;
    error_log /var/log/nginx/inference.error.log warn;
    client_max_body_size 26m;
    client_body_timeout 60s;
    add_header X-Content-Type-Options nosniff always;

    # The pipeline owns API-key validation, upload limits, and JSON/ZIP responses.
    location ~ ^/v1/(process|predictions|schema)$ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_next_upstream off;
    }

    location / {
        return 404;
    }
}
