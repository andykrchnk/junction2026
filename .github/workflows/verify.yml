name: Verify
on:
    pull_request:
    push:
        branches: [master]
permissions:
    contents: read
jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 11.25.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: pnpm
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.2.22
            - run: pnpm install --frozen-lockfile
            - run: npm --prefix design-system ci
            - run: npm --prefix design-system run build-storybook
            - run: pnpm build
            - run: pnpm check-types
            - run: pnpm lint
            - run: pnpm format:check
            - run: pnpm check-infra
